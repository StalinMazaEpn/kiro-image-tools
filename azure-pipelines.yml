name: image-tools-$(Build.BuildId)
trigger:
- main
- qa

variables:
  - name: isMainBranch
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  - name: isQABranch
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/qa')]
  - name: BUILD_TAG
    value: $(Build.BuildId)
  - name: AKS_IMAGE_TOOLS_IMAGE_NAME
    value: image-tools
  - name: AKS_NAMESPACE
    value: default

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: Build Docker Image
    jobs:
      - job: Build
        steps:
          - task: Docker@2
            displayName: Build and push image
            inputs:
              command: buildAndPush
              dockerfile: Dockerfile
              repository: $(AKS_IMAGE_TOOLS_IMAGE_NAME)
              containerRegistry: $(CONTAINER_REGISTRY_CONNECTION)
              tags: |
                $(Build.BuildId)
                latest

  - stage: DeployQA
    displayName: Deploy QA
    condition: and(eq(variables.isQABranch, true), eq(variables.isMainBranch, false))
    dependsOn: Build
    jobs:
      - deployment: DeployQA
        environment: qa
        strategy:
          runOnce:
            deploy:
              steps:
                - task: KubernetesManifest@1
                  displayName: Apply ConfigMap
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: $(AKS_SERVICE_CONNECTION)
                    namespace: $(AKS_NAMESPACE)
                    manifests: k8s/configmap.yaml
                - task: KubernetesManifest@1
                  displayName: Apply Secret
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: $(AKS_SERVICE_CONNECTION)
                    namespace: $(AKS_NAMESPACE)
                    manifests: k8s/secret.yaml
                - task: KubernetesManifest@1
                  displayName: Apply Deployment
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: $(AKS_SERVICE_CONNECTION)
                    namespace: $(AKS_NAMESPACE)
                    manifests: aks.yml
                    containers: |
                      $(CONTAINER_REGISTRY_CONNECTION).azurecr.io/$(AKS_IMAGE_TOOLS_IMAGE_NAME):$(Build.BuildId)

  - stage: DeployProduction
    displayName: Deploy Production
    condition: and(eq(variables.isMainBranch, true), eq(variables.isQABranch, false))
    dependsOn: Build
    jobs:
      - deployment: DeployProduction
        environment: prod
        strategy:
          runOnce:
            deploy:
              steps:
                - task: KubernetesManifest@1
                  displayName: Apply ConfigMap
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: $(AKS_SERVICE_CONNECTION)
                    namespace: $(AKS_NAMESPACE)
                    manifests: k8s/configmap.yaml
                - task: KubernetesManifest@1
                  displayName: Apply Secret
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: $(AKS_SERVICE_CONNECTION)
                    namespace: $(AKS_NAMESPACE)
                    manifests: k8s/secret.yaml
                - task: KubernetesManifest@1
                  displayName: Apply Deployment
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: $(AKS_SERVICE_CONNECTION)
                    namespace: $(AKS_NAMESPACE)
                    manifests: aks.yml
                    containers: |
                      $(CONTAINER_REGISTRY_CONNECTION).azurecr.io/$(AKS_IMAGE_TOOLS_IMAGE_NAME):$(Build.BuildId)
