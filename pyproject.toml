[project]
name = "image-tools"
version = "1.0.0"
description = "Image processing service with background removal"
requires-python = ">=3.11"
dependencies = [
    "flask-smorest==0.42.1",
    "Flask==2.3.3",
    "gunicorn==21.2.0",
    "ImageIO==2.37.3",
    "marshmallow==3.20.1",
    "numpy==1.26.4",
    "onnxruntime==1.20.1",
    "Pillow==10.1.0",
    "psutil==5.9.8",
    "PyMatting==1.1.15",
    "python-dotenv==1.0.0",
    "pytokens==0.4.1",
    "rembg==2.0.57",
    "requests==2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
